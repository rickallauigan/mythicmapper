# SPDX-License-Identifier: GPL-3.0-or-later
name: Virtual G8 AVD (simulation only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/src/**'
      - 'tools/virtual*'
      - 'tools/scenarios/**'
      - '.github/workflows/virtual-g8-avd.yml'
permissions:
  contents: read
concurrency:
  group: virtual-g8-avd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  avd:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
          cache: gradle
      - run: rustup show
      - name: Build existing x86_64 debug application
        run: bash ./gradlew :app:assembleDebug
      - name: Release build workers before 4GB emulator
        run: bash ./gradlew --stop
      - name: KVM access on ephemeral CI runner only
        run: sudo chmod a+rw /dev/kvm
      - name: Install pinned AOSP image and check prerequisites
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path required}}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-36;default;x86_64'
          python3 tools/virtual_g8.py doctor
          python3 tools/virtual_g8.py setup
      - name: Boot, install, run UI and deterministic mapping scenarios
        run: |
          python3 tools/virtual_g8.py boot --gpu swiftshader
          python3 tools/virtual_g8.py recover
          python3 tools/virtual_g8.py install
          python3 tools/virtual_g8.py smoke
          python3 tools/virtual_g8.py ux bubble
          python3 tools/virtual_g8.py ux home
          python3 tools/virtual_g8.py ux universal
      - name: Collect failure diagnostics
        if: failure()
        run: |
          if [ -f app/build/virtual-g8/owned-process.json ]; then
            python3 tools/virtual_g8.py collect
          fi
      - name: Stop only this workflow emulator
        if: always()
        run: |
          if [ -f app/build/virtual-g8/owned-process.json ]; then
            python3 tools/virtual_g8.py stop
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: virtual-g8-api36-x86_64
          path: |
            app/build/virtual-g8/*.json
            app/build/virtual-g8/*.xml
            app/build/virtual-g8/*.txt
            app/build/virtual-g8/*.png
            app/build/virtual-g8/emulator.log
