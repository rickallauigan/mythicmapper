name: Host validation (no physical gameplay test)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gameplay-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust Android toolchain
        run: rustup show
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: jetbrains
          cache: gradle
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache Robolectric Android runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/build.gradle') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Validate profile generators and rollback fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/check_mythic_fixtures.py
          python3 tools/profile_schema.py --check
          python3 -m unittest discover -s profiles/mlbb/samsung-s10e -p 'test_*.py'
          python3 profiles/mlbb/samsung-s10e/generate-gamesir-profile.py --version 0.1 --check
          python3 profiles/mlbb/samsung-s10e/generate-gamesir-profile.py --version 0.2 --check
          python3 profiles/mlbb/samsung-s10e/generate-gamesir-profile.py --version 0.3 --check
          python3 profiles/mlbb/samsung-s10e/generate-gamesir-profile.py --version 0.3 --aim-radius 80 --output profiles/mlbb/samsung-s10e/mlbb-gamesir-g8-v0.3-tuned.txt --check
          python3 profiles/mlbb/samsung-s10e/generate-gamesir-profile.py --phase2 --output profiles/mlbb/samsung-s10e/mlbb-gamesir-g8-phase2.txt --check
          python3 profiles/mlbb/samsung-s10e/generate-gamesir-profile.py --phase2 --select-chords --output profiles/mlbb/samsung-s10e/mlbb-gamesir-g8-phase2-select-chords.txt --check

      - name: Rust reference tests and host JNI parity
        run: |
          cargo fmt --manifest-path engine/Cargo.toml -- --check
          cargo clippy --locked --offline --manifest-path engine/Cargo.toml -- -D warnings
          cargo test --locked --offline --manifest-path engine/Cargo.toml
          bash tools/run-rust-jni-host.sh

      - name: Run native input regression suites
        run: |
          bash app/src/test/native/run-controller-probe-tests.sh
          bash app/src/test/native/run-mouse-reader-tests.sh
          bash app/src/test/native/run-reader-parent-death-tests.sh

      - name: Run Android tests, lint, inventory and build debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:dependencyInventory :app:assembleDebug :app:processReleaseMainManifest

      - name: Check actual compiled Kotlin JNI bridge on host
        run: bash tools/run-kotlin-jni-host.sh

      - name: Check source secrets and advisory coverage
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_secrets.py
          python3 tools/audit_dependencies.py app/build/reports/dependencies/inventory.json app/build/reports/dependencies/advisories.json
          sha256sum app/build/outputs/apk/debug/*.apk > app/build/reports/dependencies/SHA256SUMS


      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gameplay-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/dependencies/
          if-no-files-found: ignore
